name: diag-tmp

on:
  push:
    branches: [fix/ci-legacy-golden-test]

jobs:
  diag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -q -e ".[rdf,dev]" pyyaml
          git worktree add --detach /tmp/old d418aa6
          cp .github/diag_hash.py /tmp/diag_hash.py
      - name: Hash old and new code
        run: |
          python -c "import numpy, pandas; print(numpy.__version__, pandas.__version__)"
          python -c "import numpy; numpy.show_config()" || true
          lscpu | grep -i -E "model name|flags" | cut -c1-400
          cd /tmp/old && PYTHONPATH=/tmp/old/src python /tmp/diag_hash.py OLD
          cd $GITHUB_WORKSPACE && python /tmp/diag_hash.py NEW
