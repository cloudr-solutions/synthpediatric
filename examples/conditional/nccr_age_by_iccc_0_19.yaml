# REAL aggregate numbers: childhood cancers, all NCCR registries, ages 0-19, age by ICCC major
# group. Origin: an aggregate table from NCCR data in CGC. Release: cleared for public use as
# synthesis inputs by the team lead, 2026-11-16. One cell is below 16 (Retinoblastoma, 15-19), so
# the minimum-cell override is set explicitly below. The age table has no sex; sex comes from a separate table (see the sex target).
# Cohorts generated from this config before the sex target was added (the V1 n=26106 and V2
# n=261056 runs) have a flat sex share of about 61% Female in every ICCC group.
# Test logic: follow the data dictionary (permissible values and published frequencies), then add
# ONLY the rules taken from this table. No other rules (no consistency rules file) and no input
# from any other table.
# Docs: docs/conditional.md
# Run (from the repository root):
#   python examples/conditional/run_example.py examples/conditional/nccr_age_by_iccc_0_19.yaml \
#       --metadata <your nccr_instances.ttl> --out out/conditional/nccr_all
name: Childhood cancers, all NCCR, ages 0-19 (age by ICCC group)
metadata: nccr_instances.ttl   # point this at your NCCR snapshot (run_example.py --metadata overrides it)
source: CTC
n: 261056                      # the size of the table
seed: 2026
profile: standard
cohort:
  name: Ages 0-19
  filters:
    - variable: ageRecode19Groups
      op: equals
      values: ["00 years", "01-04 years", "05-09 years", "10-14 years", "15-19 years"]
targets:
  conditional:
    provenance:
      source: "NCCR data in CGC, all registries: icccMajor by ageRecode19Groups, ages 0-19"
      date: "2026-11-16"
      origin: cgc_aggregate    # the default minimum cell for this origin is 16
      min_cell: 0              # explicit override: one cell is below 16 (see the reason)
      override_reason: "Cleared for public use as synthesis inputs by the team lead, 2026-11-16."
      note: All NCCR registries together. The 0-4 column combines '00 years' and '01-04 years'.
    group:
      variable: icccMajor
      mix:                     # the row totals of the table
        basis: counts
        values:
          "I. Leukemias, Myeloproliferative And Myelodysplastic Diseases": 61530
          "II. Lymphomas and reticuloendothelial neoplasms": 35406
          "III. CNS and Miscellaneous Intracranial and Intraspinal Neoplasms": 58901
          "IV. Neuroblastoma And Other Peripheral Nervous Cell Tumors": 10766
          "V. Retinoblastoma": 4186
          "VI. Renal Tumors": 8559
          "VII. Hepatic Tumors": 3355
          "VIII. Malignant Bone Tumors": 11850
          "IX. Soft Tissue And Other Extraosseous Sarcomas": 15464
          "X. Germ Cell Tumors, Trophoblastic Tumors And Neoplasms Of Gonads": 15848
          "XI. Other Malignant Epithelial Neoplasms And Malignant Melanomas": 25244
          "XII. Other And Unspecified Malignant Neoplasms": 1163
          "Not classified by SEER or in situ": 8784
    scope:
      age_years: [0, 19]
    age:
      anchor: ageRecode19Groups  # the other age variables are derived from it
      bins:
        "0-4": {years: [0, 4]}   # split between '00 years' and '01-04 years' by the published ratio
        "5-9": {years: [5, 9]}
        "10-14": {years: [10, 14]}
        "15-19": {years: [15, 19]}
    targets:                     # all 13 groups are listed, so there is no 'uncovered' block
      - variable: ageRecode19Groups
        basis: counts
        by_group:
          "I. Leukemias, Myeloproliferative And Myelodysplastic Diseases": {"0-4": 25810, "5-9": 13522, "10-14": 10931, "15-19": 11267}
          "II. Lymphomas and reticuloendothelial neoplasms": {"0-4": 4277, "5-9": 5388, "10-14": 8777, "15-19": 16964}
          "III. CNS and Miscellaneous Intracranial and Intraspinal Neoplasms": {"0-4": 14968, "5-9": 13949, "10-14": 13404, "15-19": 16580}
          "IV. Neuroblastoma And Other Peripheral Nervous Cell Tumors": {"0-4": 8670, "5-9": 1244, "10-14": 481, "15-19": 371}
          "V. Retinoblastoma": {"0-4": 3999, "5-9": 152, "10-14": 27, "15-19": 8}
          "VI. Renal Tumors": {"0-4": 5790, "5-9": 1703, "10-14": 463, "15-19": 603}
          "VII. Hepatic Tumors": {"0-4": 2231, "5-9": 331, "10-14": 348, "15-19": 445}
          "VIII. Malignant Bone Tumors": {"0-4": 449, "5-9": 1892, "10-14": 4625, "15-19": 4884}
          "IX. Soft Tissue And Other Extraosseous Sarcomas": {"0-4": 3685, "5-9": 2647, "10-14": 3798, "15-19": 5334}
          "X. Germ Cell Tumors, Trophoblastic Tumors And Neoplasms Of Gonads": {"0-4": 2398, "5-9": 945, "10-14": 2670, "15-19": 9835}
          "XI. Other Malignant Epithelial Neoplasms And Malignant Melanomas": {"0-4": 587, "5-9": 1355, "10-14": 5569, "15-19": 17733}
          "XII. Other And Unspecified Malignant Neoplasms": {"0-4": 387, "5-9": 120, "10-14": 205, "15-19": 451}
          "Not classified by SEER or in situ": {"0-4": 1670, "5-9": 1071, "10-14": 1742, "15-19": 4301}
      # Sex: real shares (percent within tumor type), measured on all CTC records in CGC, all NCCR
      # registries. Female and Male only. Sex is drawn given the group, independently of age
      # (no joint age-sex table).
      - variable: sex
        basis: percent
        by_group:
          "I. Leukemias, Myeloproliferative And Myelodysplastic Diseases": {Female: 43.8, Male: 56.2}
          "II. Lymphomas and reticuloendothelial neoplasms": {Female: 40.0, Male: 60.0}
          "III. CNS and Miscellaneous Intracranial and Intraspinal Neoplasms": {Female: 50.6, Male: 49.4}
          "IV. Neuroblastoma And Other Peripheral Nervous Cell Tumors": {Female: 46.8, Male: 53.2}
          "V. Retinoblastoma": {Female: 49.5, Male: 50.5}
          "VI. Renal Tumors": {Female: 53.2, Male: 46.8}
          "VII. Hepatic Tumors": {Female: 41.1, Male: 58.9}
          "VIII. Malignant Bone Tumors": {Female: 43.2, Male: 56.8}
          "IX. Soft Tissue And Other Extraosseous Sarcomas": {Female: 45.1, Male: 54.9}
          "X. Germ Cell Tumors, Trophoblastic Tumors And Neoplasms Of Gonads": {Female: 37.6, Male: 62.4}
          "XI. Other Malignant Epithelial Neoplasms And Malignant Melanomas": {Female: 67.1, Male: 32.9}
          "XII. Other And Unspecified Malignant Neoplasms": {Female: 56.1, Male: 43.9}
          "Not classified by SEER or in situ": {Female: 55.9, Male: 44.1}
outputs: {dir: out/conditional/nccr_all, format: csv, archive: zip}
