# Recipe a: keep a published age distribution as an explicit rule. Offline.
# Run:  synthpediatric run examples/cookbook/a_age_distribution.yaml
name: Cookbook a - published age distribution
metadata: examples/nccr_ctc_dictionary.json
n: 5000
seed: 1
profile: marginals_only
targets:
  marginals:
    age_group:              # the age variable in this dictionary (5-year groups)
      "00-04": 0.36         # proportions or counts; they are normalized to sum to 1
      "05-09": 0.17
      "10-14": 0.15
      "15-19": 0.32         # categories NOT listed here (20-24 ... 35-39) are never generated
outputs: {dir: out/cookbook/a}
