# Recipe g: consistency rules (constraints). Offline.
# Run:  synthpediatric run examples/cookbook/g_consistency_rules.yaml
# The rules file names CTC columns (icccMajor, gleason*, psa*), so this recipe uses a
# small dictionary that has them. examples/nccr_ctc_dictionary.json does not.
name: Cookbook g - consistency rules
metadata: examples/cookbook/ctc_mini_dictionary.json
n: 3000
seed: 1
profile: standard
constraints:
  file: examples/ctc_consistency_rules.json
outputs: {dir: out/cookbook/g}
